# NinjaSnipp Win app, beside NinjaSnipp.exe

appUrl:         http://localhost/NinjaSnipp/PHP%20manager%20app/   # the manager (XAMPP)
hotkey:         Ctrl+Alt+Space   # opens the snippet list, modifiers Ctrl, Alt, Shift, Win + a key name
                                 # (System.Windows.Forms.Keys: Space, J, F12, ...)
insertMode:     paste            # paste: through the clipboard, restored after | type: as keystrokes
excludedApps:   []               # no typed shortcuts in these apps, process names without .exe, e.g. [KeePass]
refreshSeconds: 60               # how often the snippets are checked for changes

popup:
  width:  760
  height: 560
